# Site configuration (own layout; see README)

title: 4E Schwertberg
tagline: erneuerbare Energie effizient einsetzen
description: >-
  4E Schwertberg - erneuerbare Energie effizient einsetzen
url: "https://www.4e-schwertberg.at"
baseurl: ""
lang: de-DE
timezone: Europe/Vienna
avatar: /assets/img/4E-logo-lightbulb-small.jpg

# Used by jekyll-seo-tag and the footer
social:
  name: 4E Schwertberg - erneuerbare Energie effizient einsetzen
  email: info@4e-schwertberg.at
  links:
    - "https://www.4e-schwertberg.at"

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

collections:
  tabs:
    output: true
    sort_by: order
  pages:
    output: true

defaults:
  - scope:
      path: ""
      type: tabs
    values:
      layout: page
      permalink: /:title/

sass:
  style: compressed

exclude:
  - README.md
  - LICENSE
  - Gemfile
  - Gemfile.lock
  - vendor
  - .devcontainer
